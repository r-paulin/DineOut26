<style type="text/css">
    ul {
        li {
            margin: 0.2rem;
        }
    }
</style>
<h2>Migration to Global Variables</h2>

<h3>Configuration</h3>
<input type="checkbox" id="skip-invisible-elements" checked/><label for="skip-invisible-elements">Skip invisible elements</label>

<h3>Actions</h3>
<p>To begin the migration choose one of the options below:</p>

<ul>
    <li><button type="button" id="migrate-whole-document" data-button-type="action">Migrate the whole document</button></li>
    <li>
        <button type="button" id="migrate-current-page" data-button-type="action">
            Migrate the current page: <span id="current-page"></span>
        </button>
    </li>
    <li>
        <button type="button" id="migrate-selection" data-button-type="action" disabled>
            Migrate the current selection
        </button>
    </li>
</ul>

<p>Progress log:</p>
<div id="progress-log" style="font-family: monospace; white-space: pre-wrap"></div>

<script>
    
    const previousActionButtonsState = new WeakMap();

    function setSkipInvisibleElements(value) {
         parent.postMessage(
            {
                pluginMessage: {
                    action: {
                        type: "set-skip-invisible-elements",
                        value
                    },
                },
            },
            "*",
        );
    }

    function setElementDisabledState(elementId, isDisabled) {
        const element = document.getElementById(elementId);
        if (isDisabled) {
            element.setAttribute("disabled", "true");
        } else {
            element.removeAttribute("disabled");
        }
    }

    const skipVisibleElementsCheckbox = document.getElementById("skip-invisible-elements");
    skipVisibleElementsCheckbox.addEventListener("change", (event) => {
        setSkipInvisibleElements(event.target.checked);
    });
    setSkipInvisibleElements(skipVisibleElementsCheckbox.checked);
    
    document.getElementById("migrate-whole-document").addEventListener("click", () => {
        parent.postMessage({pluginMessage: {action: {type: "migrate-whole-document"}}}, "*");
    });

    document.getElementById("migrate-current-page").addEventListener("click", () => {
        parent.postMessage({pluginMessage: {action: {type: "migrate-current-page"}}}, "*");
    });

    document.getElementById("migrate-selection").addEventListener("click", () => {
        parent.postMessage({pluginMessage: {action: {type: "migrate-selection"}}}, "*");
    });

    function jumpToNode(nodeId) {
        parent.postMessage({pluginMessage: {action: {type: "jump-to-node", node_id: nodeId}}}, "*");
    }

    onmessage = (event) => {
        console.log("postMessage :: backend -> ui", event.data.pluginMessage);
        if ("progress" in event.data.pluginMessage) {
            const log = document.getElementById("progress-log");
            log.prepend(document.createTextNode(event.data.pluginMessage.progress + "\n"));
        }

        if ("page" in event.data.pluginMessage) {
            document.getElementById("current-page").innerText = event.data.pluginMessage.page;
        }

        if ("enable_selection_migration" in event.data.pluginMessage) {
            setElementDisabledState("migrate-selection", event.data.pluginMessage.enable_selection_migration === false);
        }

        if ("is_migration_in_progress" in event.data.pluginMessage) {
            const buttons = document.querySelectorAll("button[data-button-type='action']");
            const inProgress = event.data.pluginMessage.is_migration_in_progress;
            for (const button of buttons) {
                let buttonNewState = inProgress;
                if (inProgress) {
                    previousActionButtonsState.set(button, button.disabled);
                } else {
                    buttonNewState = previousActionButtonsState.get(button) || false;
                    previousActionButtonsState.delete(button);
                }
                setElementDisabledState(button.id, buttonNewState);
            }
        }

        if ("migration_statistics" in event.data.pluginMessage) {
            const stats = event.data.pluginMessage.migration_statistics.statistics;
            const total = stats.total.length;
            const migrated = stats.migrated.length;
            const skipped = stats.skipped.length;
            const no_match = stats.no_match.length;
            const unsupported = stats.unsupported.length;
            const technical_error = stats.technical_error.length;

            const log = document.getElementById("progress-log");

            if (technical_error > 0) {
                log.prepend(
                    createJumpToNodeActionButton(stats.technical_error, (item) => {
                        return [itemTypeToUpperCase(item), item.node_id, item.technical_error_reason];
                    }),
                );
                log.prepend(document.createTextNode("Technical errors: ⚠️\n"));
            }

            if (stats.unsupported.length > 0) {
                log.prepend(
                    createJumpToNodeActionButton(stats.unsupported, (item) => {
                        return [itemTypeToUpperCase(item), item.node_id];
                    }),
                );
                log.prepend(document.createTextNode("Nodes with unsupported types for variable migration:\n"));
            }

            if (stats.no_match.length > 0) {
                log.prepend(
                    createJumpToNodeActionButton(stats.no_match, (item) => {
                        return [itemTypeToUpperCase(item), item.variable_name, item.node_id];
                    }),
                );
                log.prepend(document.createTextNode("Nodes with no matching Colors [Global] variable:\n"));
            }

            const firstLine = `=== Migration statistics for page: "${event.data.pluginMessage.migration_statistics.page_name}" ===`;
            const textNode = document.createTextNode(
                `\n${firstLine}\n` +
                    `Total variables processed: ${total}\n` +
                    `- Migrated: ${migrated}\n` +
                    `- Skipped (already using Colors [Global] variables): ${skipped}\n` +
                    `- No matching Colors [Global] variable found: ${no_match}\n` +
                    `- Not supported (mixed or unsupported types): ${unsupported}\n` +
                    `- Could not migrate due to technical error: ${technical_error} ${
                        technical_error > 0 ? "⚠️" : ""
                    }\n` +
                    `${"=".repeat(firstLine.length)}\n\n`,
            );
            log.prepend(textNode);
        }
    };

    function createJumpToNodeActionButton(items, valueCallback) {
        const ul = document.createElement("ul");
        items.forEach((item) => {
            const li = document.createElement("li");
            const actionLink = document.createElement("button");
            actionLink.addEventListener("click", () => {
                jumpToNode(item.node_id);
            });
            const actionButtonValueChunks = valueCallback(item);

            actionLink.appendChild(document.createTextNode(`${actionButtonValueChunks.join(" :: ")}`));
            li.appendChild(actionLink);
            ul.appendChild(li);
        });
        return ul;
    }

    function itemTypeToUpperCase(item) {
        return item.type.charAt(0).toUpperCase() + item.type.slice(1);
    }
</script>
