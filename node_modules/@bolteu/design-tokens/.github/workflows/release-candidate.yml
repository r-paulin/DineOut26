name: Release / RC

on:
  workflow_dispatch:

concurrency:
  group: "ds:rc"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release design-tokens RC
    steps:
      - name: Set branch name
        id: branch
        run: echo "::set-output name=branch-name::$(echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}})"

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.branch.outputs.branch-name }}
          token: ${{ secrets.UIP_GITHUB_API_TOKEN }}
          fetch-depth: 0 # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits

      - name: Set current sha
        id: short-sha
        run: echo "::set-output name=short-sha::$(git rev-parse --short HEAD)"

      - name: Set git user to uipblot
        run: |
          git config --global user.name "uipblot"
          git config --global user.email "uipbot@bolt.eu"

      - uses: ./.github/actions/version-packages
        with:
          release-type: "rc"
          shapshot-id: rc.${{ steps.short-sha.outputs.short-sha }}
          github-token: ${{ secrets.UIP_GITHUB_API_TOKEN }}

      - uses: ./.github/actions/publish-packages
        with:
          npm-tag: "rc"
          publish-branch: ${{ steps.branch.outputs.branch-name }}
          github-token: ${{ secrets.UIP_GITHUB_API_TOKEN }}

      - name: Set info summary
        shell: /bin/bash -l {0}
        run: |
          if [ -f "./package.json" ]; then
            PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")
            PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")

            # Print the package name and version to the console.
            echo "$PACKAGE_NAME version $PACKAGE_VERSION"

            # Append the information to $GITHUB_STEP_SUMMARY.
            echo "$PACKAGE_NAME version $PACKAGE_VERSION" >> $GITHUB_STEP_SUMMARY
          else
            echo "No package.json found in root directory."
          fi
