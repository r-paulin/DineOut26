name: "Generate Tokens"

on:
    schedule:
        - cron: "0 4 * * *" # every day at 4am
    workflow_dispatch:

jobs:
    generate_tokens:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout repository"
              uses: actions/checkout@v4

            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: "Setup pnpm"
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

            - name: "Generate Tokens"
              run: |
                  pnpm install
                  node tooling/index.mjs

            - name: "Create PR"
              uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5
              with:
                  commit-message: "Cron generate tokens"
                  title: "AUTOMATION: Cron generate tokens"
                  body: "Automatic update of tokens"
                  branch: "cron-generate-tokens"
                  delete-branch: true
                  reviewers: darja-bolt, libahipi
