name: Release / Production / Publishing

on:
  pull_request:
    branches:
      - main
    types: [closed]

concurrency:
  group: "ds:publish"
  cancel-in-progress: false

jobs:
  publish-packages:
    name: Publish packages
    if: ${{ startsWith(github.event.pull_request.head.ref, 'changeset-release') && github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.UIP_GITHUB_API_TOKEN }}
          fetch-depth: 1

      - name: Set git user to uipblot
        run: |
          git config --global user.name "uipblot"
          git config --global user.email "uipbot@bolt.eu"

      - uses: ./.github/actions/publish-packages
        with:
          npm-tag: "latest"
          github-token: ${{ secrets.UIP_GITHUB_API_TOKEN }}
