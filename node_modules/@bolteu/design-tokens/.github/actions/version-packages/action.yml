name: "UI Platform / Version packages"
description: "Version packages"
inputs:
    release-type:
        description: "Release type - rc or production"
        required: true
    shapshot-id:
        description: "Shapshot id - only applicable for RC releases"
        required: false
    github-token:
        description: "Github API Token"
        required: true

runs:
    using: "composite"
    steps:
        - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

        - uses: actions/setup-node@v4
          with:
              registry-url: "https://npm.pkg.github.com"
              node-version-file: ".nvmrc"

        - name: Install dependencies
          shell: /bin/bash -l {0}
          run: pnpm install --prefer-offline --frozen-lockfile
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}

        - name: Update versions | RC
          if: ${{ inputs.release-type == 'rc' }}
          shell: /bin/bash -l {0}
          run: |
              echo 'Preparing RC release...'

              pnpm changeset version --snapshot '${{ inputs.shapshot-id }}'
              pnpm install --no-frozen-lockfile
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}
              GITHUB_TOKEN: ${{ inputs.github-token }}

        - name: Update versions | Production
          if: ${{ inputs.release-type == 'production' }}
          uses: changesets/action@06245a4e0a36c064a573d4150030f5ec548e4fcc # v1
          with:
              setupGitUser: false
              version: pnpm release:version
              title: "chore(releases): :package: Bump version"
              commit: "chore(releases): :package: Bump version"
          env:
              GITHUB_TOKEN: ${{ inputs.github-token }}
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}
