name: "UI Platform / Publish packages"
description: "Publish packages"
inputs:
    npm-tag:
        description: "npm tag"
        required: false
        default: "latest"
    publish-branch:
        description: "The primary branch of the repository which is used for publishing the latest changes."
        required: false
        default: "main"
    github-token:
        description: "Github API Token"
        required: true

runs:
    using: "composite"
    steps:
        - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

        - uses: actions/setup-node@v4
          with:
              registry-url: "https://npm.pkg.github.com"
              node-version-file: ".nvmrc"

        - name: Install dependencies
          shell: /bin/bash -l {0}
          run: pnpm install --prefer-offline --frozen-lockfile
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}

        - name: Publish rc packages
          shell: /bin/bash -l {0}
          if: ${{ inputs.npm-tag == 'rc' }}
          run: pnpm publish -r --tag '${{ inputs.npm-tag }}' --publish-branch '${{ inputs.publish-branch }}' --no-git-checks
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}

        - name: Publish packages
          shell: /bin/bash -l {0}
          if: ${{ inputs.npm-tag == 'latest' }}
          run: pnpm publish -r --tag '${{ inputs.npm-tag }}' --publish-branch '${{ inputs.publish-branch }}'
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}

        - name: Create version tag and push it
          shell: /bin/bash -l {0}
          if: ${{ inputs.npm-tag == 'latest' }}
          run: |
              DT_VERSION=$(pnpm show ./ version)
              git tag -a v${DT_VERSION} -m "v${DT_VERSION}"
              git push origin v${DT_VERSION}
